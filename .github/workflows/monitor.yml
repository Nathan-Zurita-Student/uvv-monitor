name: UVV Monitor

# O Apps Script dispara as nove coletas diárias 20 min antes de cada resumo.
# Estes três horários são apenas reservas caso o Apps Script não consiga disparar o GitHub.
on:
  schedule:
    - cron: '35 14 * * *'
    - cron: '35 20 * * *'
    - cron: '35 1 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: Horário lógico em America/Sao_Paulo
        required: true
        default: '12:00'
        type: choice
        options: ['10:00', '12:00', '14:00', '16:00', '18:00', '20:00', '21:00', '22:00', '23:00']

permissions:
  contents: read

# Uma coleta por vez: um disparo manual e um agendado não enviam a mesma coisa duas vezes.
concurrency:
  group: uvv-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo
      # Ativar a variável somente após publicar/testar o resumo no Apps Script.
      DAILY_DIGEST_EXTERNAL: ${{ vars.DAILY_DIGEST_EXTERNAL || 'false' }}
      UVV_USERNAME: ${{ secrets.UVV_USERNAME }}
      UVV_PASSWORD: ${{ secrets.UVV_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_WEBHOOK_ENABLED: ${{ secrets.TELEGRAM_WEBHOOK_ENABLED || 'false' }}
      TELEGRAM_ACTIONS_WEB_APP_URL: ${{ secrets.TELEGRAM_ACTIONS_WEB_APP_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID || 'primary' }}
      MOODLE_CALENDAR_URL: ${{ secrets.MOODLE_CALENDAR_URL }}
      DRY_RUN: ${{ secrets.DRY_RUN || 'true' }}
      AI_ENABLED: ${{ secrets.AI_ENABLED || 'false' }}
      AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-6-luna' }}
      AI_MAX_CALLS_PER_RUN: ${{ secrets.AI_MAX_CALLS_PER_RUN || '20' }}
      AI_MAX_INPUT_CHARS: ${{ secrets.AI_MAX_INPUT_CHARS || '20000' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resolver horário lógico
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "RUN_SLOT=${{ inputs.slot }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.event.schedule }}" == "35 14 * * *" ]]; then
            echo "RUN_SLOT=12:00" >> "$GITHUB_ENV"
          elif [[ "${{ github.event.schedule }}" == "35 20 * * *" ]]; then
            echo "RUN_SLOT=18:00" >> "$GITHUB_ENV"
          else
            echo "RUN_SLOT=23:00" >> "$GITHUB_ENV"
          fi
      - run: npm start
      - name: Salvar diagnósticos privados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uvv-monitor-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
