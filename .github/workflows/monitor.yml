name: UVV Monitor

on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 20 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: Horário lógico em America/Sao_Paulo
        required: true
        default: '12:00'
        type: choice
        options: ['12:00', '17:00', '21:00']

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo
      UVV_USERNAME: ${{ secrets.UVV_USERNAME }}
      UVV_PASSWORD: ${{ secrets.UVV_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_WEBHOOK_ENABLED: ${{ secrets.TELEGRAM_WEBHOOK_ENABLED || 'false' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID || 'primary' }}
      DRY_RUN: ${{ secrets.DRY_RUN || 'true' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resolver horário lógico
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "RUN_SLOT=${{ inputs.slot }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.event.schedule }}" == "0 15 * * *" ]]; then
            echo "RUN_SLOT=12:00" >> "$GITHUB_ENV"
          elif [[ "${{ github.event.schedule }}" == "0 20 * * *" ]]; then
            echo "RUN_SLOT=17:00" >> "$GITHUB_ENV"
          else
            echo "RUN_SLOT=21:00" >> "$GITHUB_ENV"
          fi
      - run: npm run check
      - run: npm start
      - name: Salvar diagnósticos privados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uvv-monitor-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
