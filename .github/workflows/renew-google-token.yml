name: Renovar token Google (temporario)

on:
  workflow_dispatch:
    inputs:
      authorization_code:
        description: Codigo OAuth de uso unico
        required: true
        type: string

permissions:
  contents: read

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Trocar codigo e devolver token criptografado
        uses: actions/github-script@v8
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTHORIZATION_CODE: ${{ inputs.authorization_code }}
          PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA8gOOQv5yVuP2BgRGfTOQ
            G7bZYal68dVeMDjGgTIQo0T5Wjn21376F5mhIyNxzrsgs+caQC/sP9FepQh3uw12
            Xb1FXBOI66oSf1yL4V7hUWMhD3WH2Wzrl/1WpmWLJDl3qv/XleRkgaKr3gFp7EQz
            6dbjAhSQsJd28zdheS/KCo8oyzY4UFB+VkhehNc8kdgv8ysmJUnnRlUgZMuk9Q2L
            EtXhnNMBxM9pQceGOs6V8EfBM5YlkS/V4F6g9/ltafpdBhJ6jKwb7Uv3dwxgzfl0
            iLdRz5HCDE1EIfOoyf8uoX+qYauDMmXksZwfzpT61JC29IEOku08EDWVecn1hdMM
            EQIDAQAB
            -----END PUBLIC KEY-----
        with:
          script: |
            const crypto = require('node:crypto');
            const body = new URLSearchParams({
              client_id: process.env.GOOGLE_CLIENT_ID,
              client_secret: process.env.GOOGLE_CLIENT_SECRET,
              code: process.env.AUTHORIZATION_CODE,
              grant_type: 'authorization_code',
              redirect_uri: 'http://127.0.0.1:53682/oauth2callback',
            });
            const response = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'content-type': 'application/x-www-form-urlencoded' },
              body,
            });
            const result = await response.json();
            if (!response.ok || !result.refresh_token) {
              core.setFailed(`Falha ao renovar token (${response.status}): ${result.error ?? 'sem refresh token'}`);
              return;
            }
            core.setSecret(result.refresh_token);
            const encrypted = crypto.publicEncrypt(
              { key: process.env.PUBLIC_KEY, oaepHash: 'sha256' },
              Buffer.from(result.refresh_token, 'utf8'),
            ).toString('base64');
            console.log(`ENCRYPTED_REFRESH_TOKEN=${encrypted}`);
